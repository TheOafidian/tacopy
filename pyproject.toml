[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["tacopy"]
namespaces = false

[project]
dynamic = ["version"]
name = "tacopy"
dependencies = ["pandas", "matplotlib", "scikit-learn", "scikit-bio", "seaborn"]
requires-python = ">=3.6"
